[[redirects]]
from = "/vorlagen/*"
to = "/vorlagen/:splat"
status = 200

[[redirects]]
from = "/viewer/*"
to = "/viewer/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/viewer/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/viewer/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"