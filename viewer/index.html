<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="manifest" href="./manifest.webmanifest">

<style>

  details.accordion > summary{ list-style:none; cursor:pointer; padding:12px 14px; font-weight:600; background:#e2e6ec; display:flex; justify-content:space-between; gap:10px; }
  details.accordion > summary::-webkit-details-marker{ display:none; }

<body>
<header>
  <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
    <div>
      <h1>FaSt-Doku Viewer</h1>
      <p>Läuft lokal, ohne Internetverbindung. Lädt die täglichen, PIN-geschützten Backup-ZIPs aus der FaSt-Doku App ein. Gespeicherte Daten sind bei jedem Öffnen zusätzlich mit einer PIN gesperrt.</p>
    </div>
    <button id="hardRefreshBtn" class="secondary" style="flex-shrink:0; white-space:nowrap;">🔄 Aktualisieren</button>
  </div>
</header>
<main id="app"></main>

<script src="./zip-full.min.js"></script>
<script type="module">
// ============================================================
// Export-Datei laden: die ZIP enthält eine einzige Datei (appData.json)
// mit dem vollständigen, unverschlüsselten JSON-Stand aller App-Daten,
// nur durch die ZIP-eigene Passwortverschlüsselung (mit der PIN) vor
// zufälligem Mitlesen geschützt - siehe modules/backupReminder.js in der
// Haupt-App, das dieses Format erzeugt (Download bzw. mailto durch den
// Therapeuten, kein automatischer Versand).
// ============================================================
async function readExportFile(file, pin) {
  const zipLib = window.zip;
  if (!zipLib) throw new Error("ZIP-Bibliothek nicht geladen.");

  const reader = new zipLib.ZipReader(new zipLib.BlobReader(file));
  try {
    const entries = await reader.getEntries();
    const appEntry = entries.find((e) => e.filename === "appData.json");

    if (!appEntry) {
      throw new Error("Datei ist keine gültige FaSt-Doku Viewer-Exportdatei.");
    }

    let appData;
    try {
      appData = JSON.parse(await appEntry.getData(new zipLib.TextWriter(), { password: pin }));
    } catch {
      throw new Error("Falsche PIN oder beschädigte Datei.");
    }

    return { appData };
  } finally {
    await reader.close();
  }
}

// ============================================================
// Datumshilfen (Kopie der Kernlogik aus core/date-utils.js /
// modules/fristen.js der Haupt-App)
// ============================================================
function parseComparableDate(value) {
  const s = String(value || "").trim();
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return null;
  const year = +m[1], month = +m[2], day = +m[3];
  const d = new Date(year, month - 1, day, 12, 0, 0, 0);
  if (d.getFullYear() != year || d.getMonth() + 1 != month || d.getDate() != day) return null;
  return d;
}
function getComparableFromDate(date) {
  if (!(date instanceof Date) || isNaN(date.getTime())) return null;
  const yyyy = String(date.getFullYear());
  const mm = String(date.getMonth() + 1).padStart(2, "0");
  const dd = String(date.getDate()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd}`;
}
function parseDeDate(value) {
  const s = String(value || "").trim();
  const m = s.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if (!m) return null;
  const comparable = `${m[3]}-${m[2]}-${m[1]}`;
  return parseComparableDate(comparable) ? comparable : null;
}
function formatDeDate(value) {
  const comparable = parseComparableDate(value) ? value : parseDeDate(value);
  const d = parseComparableDate(comparable);
  if (!d) return "";
  return `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")}.${d.getFullYear()}`;
}
function addDays(date, days) {
  const d = new Date(date.getTime());
  d.setDate(d.getDate() + days);
  return d;
}
function totalAnwendungsmenge(items) {
  let sum = 0;
  (items || []).forEach((item) => {
    if (!item || item.type === "Blanko") return;
    const n = Number(item.count);
    if (Number.isFinite(n)) sum += n;
  });
  return sum;
}
function getRezeptFristSummary(rezept) {
  const comparable = parseDeDate(rezept?.ausstell || "");
  const ausstellDate = comparable ? parseComparableDate(comparable) : null;
  if (!ausstellDate) return "Ausstellungsdatum fehlt";
  const days = (rezept?.bg || rezept?.dringend) ? 14 : 28;
  const latestStart = addDays(ausstellDate, days);
  return `Beginn bis ${formatDeDate(getComparableFromDate(latestStart))} (${totalAnwendungsmenge(rezept?.items)}x)`;
}

// ============================================================
// Lokaler Speicher (Abgleich-Logik: neuere Exporte überschreiben
// ältere Einträge, keine Duplikate, gelöschte Patienten werden
// als inaktiv markiert statt gelöscht)
// ============================================================
const STORE_KEY = "fastdoku_viewer_store_v1";

function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    return raw ? JSON.parse(raw) : { therapists: {} };
  } catch {
    return { therapists: {} };
  }
}
function saveStore(store) {
  localStorage.setItem(STORE_KEY, JSON.stringify(store));
}

function mergeAppDataIntoStore(store, appData) {
  const therapistId = appData.settings?.therapistId || "unbekannt";
  const therapistName = appData.settings?.therapistName || "Unbekannter Therapeut";
  const existing = store.therapists[therapistId] || { therapistId, therapistName, homes: [], aerzte: [], nachbestellHistory: [] };

  const existingHomesById = new Map((existing.homes || []).map((h) => [h.homeId, h]));
  const newHomeIds = new Set((appData.homes || []).map((h) => h.homeId));

  const mergedHomes = (appData.homes || []).map((home) => {
    const prevHome = existingHomesById.get(home.homeId);
    const newPatientIds = new Set((home.patients || []).map((p) => p.patientId));
    const mergedPatients = (home.patients || []).map((p) => ({ ...p, inactive: false }));

    (prevHome?.patients || []).forEach((p) => {
      if (!newPatientIds.has(p.patientId)) {
        mergedPatients.push({ ...p, inactive: true });
      }
    });

    return { ...home, patients: mergedPatients };
  });

  // Einrichtungen, die im neuen Export komplett fehlen, bleiben als bisher
  // bekannter Stand erhalten (nicht gelöscht).
  (existing.homes || []).forEach((h) => {
    if (!newHomeIds.has(h.homeId)) mergedHomes.push(h);
  });

  // Für die Stundenübersicht (Tag/Zeitraum + Saldo) benötigte Einstellungen
  // und Zusatzdaten - kommen komplett aus jedem Export mit, daher immer
  // frisch übernehmen (nur pro Feld auf den bisherigen Stand zurückfallen,
  // falls ein einzelnes Feld in einem älteren/unvollständigen Export fehlt).
  const prevSettings = existing.settings || {};
  const newSettings = appData.settings || {};

  store.therapists[therapistId] = {
    therapistId,
    therapistName,
    homes: mergedHomes,
    aerzte: appData.aerzte && appData.aerzte.length ? appData.aerzte : (existing.aerzte || []),
    nachbestellHistory: appData.nachbestellHistory && appData.nachbestellHistory.length ? appData.nachbestellHistory : (existing.nachbestellHistory || []),
    kilometer: appData.kilometer && appData.kilometer.travelLog ? appData.kilometer : (existing.kilometer || { travelLog: [] }),
    abgabeHistory: appData.abgabeHistory && appData.abgabeHistory.length ? appData.abgabeHistory : (existing.abgabeHistory || []),
    settings: {
      workDays: newSettings.workDays || prevSettings.workDays || [],
      weeklyHours: newSettings.weeklyHours || prevSettings.weeklyHours || "",
      fastStartDatum: newSettings.fastStartDatum || prevSettings.fastStartDatum || "",
      stundenStartsaldoMinuten: newSettings.stundenStartsaldoMinuten || prevSettings.stundenStartsaldoMinuten || 0
    },
    abwesenheiten: appData.abwesenheiten && appData.abwesenheiten.length ? appData.abwesenheiten : (existing.abwesenheiten || []),
    specialDays: appData.specialDays && appData.specialDays.length ? appData.specialDays : (existing.specialDays || []),
    stundenAbgleiche: appData.stundenAbgleiche && appData.stundenAbgleiche.length ? appData.stundenAbgleiche : (existing.stundenAbgleiche || []),
    lastImportAt: new Date().toISOString()
  };

  return store;
}

// ============================================================
// PIN-Sperre beim Öffnen: die im Browser gespeicherten Therapeuten-
// Daten (localStorage, aus zuvor eingespielten Backup-ZIPs) sind ohne
// diese Sperre für jeden lesbar, der das Gerät/den Browser öffnet -
// unabhängig von der ZIP-eigenen PIN-Abfrage beim Einspielen einer
// neuen Datei. Der Unlock-Status wird bewusst NICHT gespeichert
// (nur im Arbeitsspeicher), damit bei jedem erneuten Öffnen der Seite
// wieder die PIN verlangt wird.
// ============================================================
const APP_UNLOCK_PIN = "1550";
let isUnlocked = false;

function hasAnyStoredData() {
  return Object.keys(store.therapists || {}).length > 0;
}

function renderLockScreen() {
  app.innerHTML = `
    <div class="card">
      <h2>Gesperrt</h2>
      <p class="muted">Zum Schutz der gespeicherten Patientendaten bitte die PIN eingeben.</p>
      <label for="unlockPinInput">PIN</label>
      <input id="unlockPinInput" type="password" inputmode="numeric" autocomplete="off">
      <div class="row"><button id="unlockBtn">Entsperren</button></div>
      <div id="unlockMsg" class="error"></div>
    </div>
  `;

  const tryUnlock = () => {
    const pin = document.getElementById("unlockPinInput").value;
    if (pin === APP_UNLOCK_PIN) {
      isUnlocked = true;
      renderGate();
    } else {
      document.getElementById("unlockMsg").textContent = "Falsche PIN.";
    }
  };

  document.getElementById("unlockBtn").onclick = tryUnlock;
  document.getElementById("unlockPinInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") tryUnlock();
  });
  document.getElementById("unlockPinInput").focus();
}

function renderGate() {
  if (hasAnyStoredData() && !isUnlocked) {
    renderLockScreen();
  } else {
    render();
  }
}

// ============================================================
// UI
// ============================================================
const app = document.getElementById("app");
let store = loadStore();
let uiState = {
  expandedTherapist: null,
  activeTab: {},
  searchText: {},
  groupMode: {},      // pro Therapeut: "home" | "alpha" (Ansicht im Reiter Einrichtung/Patient)
  openHomes: {},      // pro Therapeut: Set der aufgeklappten Einrichtungs-IDs
  openPatients: {},   // pro Therapeut: Set der aufgeklappten Patienten-IDs
  openArzt: {},       // pro Therapeut: Set der aufgeklappten Arztnamen
  stundenMode: {},    // pro Therapeut: "tag" | "zeitraum"
  stundenDate: {},    // pro Therapeut: gewähltes Einzeldatum (Tag-Modus)
  stundenFrom: {},    // pro Therapeut: Zeitraum-Start
  stundenTo: {}       // pro Therapeut: Zeitraum-Ende
};

function getStateSet(bucket, therapistId) {
  if (!bucket[therapistId]) bucket[therapistId] = new Set();
  return bucket[therapistId];
}

function esc(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function getAllPatientsForTherapist(therapist) {
  const rows = [];
  (therapist.homes || []).forEach((home) => {
    (home.patients || []).forEach((patient) => {
      rows.push({ home, patient });
    });
  });
  rows.sort((a, b) => {
    const an = `${a.patient.lastName || ""} ${a.patient.firstName || ""}`.trim();
    const bn = `${b.patient.lastName || ""} ${b.patient.firstName || ""}`.trim();
    return an.localeCompare(bn, "de");
  });
  return rows;
}

function getAllDoctorsForTherapist(therapist) {
  const namesFromRezepte = new Set();
  (therapist.homes || []).forEach((home) => {
    (home.patients || []).forEach((patient) => {
      (patient.rezepte || []).forEach((rezept) => {
        const name = String(rezept.arzt || "").trim();
        if (name) namesFromRezepte.add(name);
      });
    });
  });
  (therapist.aerzte || []).forEach((arzt) => {
    const name = String(arzt.name || "").trim();
    if (name) namesFromRezepte.add(name);
  });

  const addressByName = new Map((therapist.aerzte || []).map((a) => [a.name, a.adresse || ""]));
  return Array.from(namesFromRezepte)
    .map((name) => ({ name, adresse: addressByName.get(name) || "" }))
    .sort((a, b) => a.name.localeCompare(b.name, "de"));
}

function getPatientsForDoctor(therapist, doctorName) {
  const rows = [];
  (therapist.homes || []).forEach((home) => {
    (home.patients || []).forEach((patient) => {
      const hasThisDoctor = (patient.rezepte || []).some((r) => String(r.arzt || "").trim() === doctorName);
      if (hasThisDoctor) rows.push({ home, patient });
    });
  });
  return rows.sort((a, b) => `${a.patient.lastName} ${a.patient.firstName}`.localeCompare(`${b.patient.lastName} ${b.patient.firstName}`, "de"));
}

function getKilometerForPatient(therapist, patientId) {
  const travelLog = therapist.kilometer?.travelLog || [];
  return travelLog.filter((item) => {
    const from = String(item.fromPointId || "");
    const to = String(item.toPointId || "");
    return from === `hb:${patientId}` || to === `hb:${patientId}`;
  });
}

function renderZuzahlungLabel(status) {
  if (status === "ja") return "Befreit: Ja";
  if (status === "nein") return "Befreit: Nein";
  if (status === "ungeklaert") return "Befreit: noch nicht geklärt";
  return "—";
}

// Chronologischer Vergleich von TT.MM.JJJJ-Daten (absteigend, neueste zuerst).
// parseDeDate() liefert das vergleichbare JJJJ-MM-DD-Format zurück, das sich
// als String korrekt lexikografisch sortieren lässt - eine naive Sortierung
// der Rohwerte "TT.MM.JJJJ" wäre dagegen falsch (z.B. "20.01.2026" vs.
// "05.03.2026": chronologisch früher, aber alphabetisch "größer").
function compareDeDatesDesc(a, b) {
  const da = parseDeDate(a);
  const db = parseDeDate(b);
  if (da && db) return db.localeCompare(da);
  if (da) return -1;
  if (db) return 1;
  return 0;
}

// ============================================================
// Stundenkonto/Stundensaldo-Logik (Kopie der Kernlogik aus ui/views.js der
// Haupt-App, für die neue Stundenübersicht im Viewer) - berücksichtigt
// Arbeitstage/-stunden pro Woche, das FaSt-Startdatum (Saldo zählt erst ab
// diesem Datum), Abwesenheiten (Urlaub/Krank), Feiertage, den Startsaldo vor
// App-Einführung sowie manuelle Stundenabgleiche (Auszahlung/Überstundenfrei).
// ============================================================
function getFastStartDatumComparable(settings) {
  const value = String(settings?.fastStartDatum || "").trim();
  if (!value) return "";
  return parseComparableDate(value) ? value : (parseDeDate(value) || "");
}
function getEffectiveTimeSummaryFromDate(fromDate, fastStartComparable) {
  const requestedFrom = parseDeDate(fromDate);
  if (requestedFrom && fastStartComparable) {
    return formatDeDate(requestedFrom > fastStartComparable ? requestedFrom : fastStartComparable);
  }
  if (requestedFrom) return formatDeDate(requestedFrom);
  if (fastStartComparable) return formatDeDate(fastStartComparable);
  return String(fromDate || "").trim();
}
function isDateInRange(dateValue, fromDate, toDate) {
  const current = parseDeDate(dateValue);
  const from = parseDeDate(fromDate);
  const to = parseDeDate(toDate);
  if (!current) return false;
  if (from && current < from) return false;
  if (to && current > to) return false;
  return true;
}
function listComparableDatesInRange(fromDate, toDate) {
  const from = parseDeDate(fromDate);
  const to = parseDeDate(toDate);
  const start = parseComparableDate(from);
  const end = parseComparableDate(to);
  if (!start || !end || start > end) return [];
  const rows = [];
  const cursor = new Date(start.getTime());
  while (cursor <= end) {
    rows.push(getComparableFromDate(cursor));
    cursor.setDate(cursor.getDate() + 1);
  }
  return rows;
}
function getWorkDayCodeFromComparable(comparableDate) {
  const date = parseComparableDate(comparableDate);
  if (!date) return "";
  const dayMap = ["SO", "MO", "DI", "MI", "DO", "FR", "SA"];
  return dayMap[date.getDay()] || "";
}
function getDailyPlannedMinutes(settings) {
  const workDays = Array.isArray(settings?.workDays) ? settings.workDays.filter(Boolean) : [];
  const weeklyHoursValue = String(settings?.weeklyHours || "").replace(",", ".").trim();
  const weeklyHours = Number(weeklyHoursValue);
  if (!workDays.length || !Number.isFinite(weeklyHours) || weeklyHours <= 0) return 0;
  return Math.round((weeklyHours * 60) / workDays.length);
}
function getStundenStartsaldoMinutes(settings) {
  const value = Number(settings?.stundenStartsaldoMinuten || 0);
  return Number.isFinite(value) ? Math.round(value) : 0;
}
function getSignedMinutesLabel(minutes) {
  const total = Number(minutes) || 0;
  const sign = total < 0 ? "-" : "+";
  const absolute = Math.abs(total);
  const h = Math.floor(absolute / 60);
  const m = absolute % 60;
  return `${sign}${h}:${String(m).padStart(2, "0")} Stunden`;
}
function formatHoursClockLabel(minutes) {
  const total = Math.max(0, Number(minutes) || 0);
  const h = Math.floor(total / 60);
  const m = total % 60;
  return `${h}:${String(m).padStart(2, "0")} Stunden`;
}
function formatMinutesLabel(minutes) {
  const total = Number(minutes) || 0;
  const h = Math.floor(total / 60);
  const m = total % 60;
  if (!h) return `${m} Min.`;
  if (!m) return `${h} Std.`;
  return `${h} Std. ${m} Min.`;
}
function isComparableDateWithinAbsence(comparableDate, absence) {
  const from = parseDeDate(absence?.from);
  const to = parseDeDate(absence?.to);
  if (!from || !to || !comparableDate) return false;
  return comparableDate >= from && comparableDate <= to;
}
function getAbsenceForComparableDate(therapist, comparableDate) {
  return (therapist.abwesenheiten || []).find((item) => isComparableDateWithinAbsence(comparableDate, item)) || null;
}
function getSpecialDayForComparableDate(therapist, comparableDate) {
  if (!comparableDate) return null;
  const targetDate = formatDeDate(comparableDate);
  return (therapist.specialDays || []).find((item) => item?.date === targetDate) || null;
}

function rezeptSummaryForViewer(rezept) {
  const items = rezept?.items || [];
  const parts = items.map((item) => {
    if (item?.type === "Blanko") return "Blanko";
    return item?.count ? `${item.type} ${item.count}x` : item?.type;
  });
  return parts.join(", ") || "Keine Leistung";
}

function collectAllTimeEntriesForTherapist(therapist) {
  const rows = [];
  (therapist.homes || []).forEach((home) => {
    (home.patients || []).forEach((patient) => {
      const patientName = `${patient.lastName || ""}, ${patient.firstName || ""}`.replace(/^,\s*/, "").trim() || "Ohne Namen";
      (patient.rezepte || []).forEach((rezept) => {
        (rezept.timeEntries || []).forEach((entry) => {
          const minutes = Number(entry?.minutes || 0);
          if (!Number.isFinite(minutes) || minutes <= 0) return;
          rows.push({
            date: String(entry?.date || "").trim(),
            minutes,
            patientName,
            birthDate: patient.birthDate || "",
            homeName: home.name || "",
            homeId: home.homeId || "",
            patientId: patient.patientId || "",
            rezeptLabel: rezeptSummaryForViewer(rezept)
          });
        });
      });
    });
  });
  return rows;
}

// Liefert Soll-/Ist-Zeit + Gesamtsaldo für den angefragten Zeitraum (Saldo
// zählt - wie in der Haupt-App - erst ab dem FaSt-Startdatum) sowie eine vom
// Startdatum UNABHÄNGIGE Patienten-Aufstellung ("wer wurde im gewählten
// Zeitraum tatsächlich behandelt", reine Ist-Übersicht statt Saldo-Bestandteil).
function getTimePeriodSummaryForViewer(therapist, fromDate, toDate) {
  const settings = therapist.settings || {};
  const fastStartComparable = getFastStartDatumComparable(settings);
  const effectiveFromDate = getEffectiveTimeSummaryFromDate(fromDate, fastStartComparable);

  const allEntries = collectAllTimeEntriesForTherapist(therapist);
  const totalsByDate = new Map();
  allEntries
    .filter((entry) => isDateInRange(entry.date, effectiveFromDate, toDate))
    .forEach((entry) => totalsByDate.set(entry.date, (totalsByDate.get(entry.date) || 0) + entry.minutes));

  const periodDates = listComparableDatesInRange(effectiveFromDate, toDate);
  const workDays = Array.isArray(settings.workDays) ? settings.workDays : [];
  const dailyPlannedMinutes = getDailyPlannedMinutes(settings);

  let totalMinutes = 0;
  let plannedMinutes = 0;
  periodDates.forEach((comparableDate) => {
    const dateDe = formatDeDate(comparableDate);
    totalMinutes += Number(totalsByDate.get(dateDe) || 0);
    const workDayCode = getWorkDayCodeFromComparable(comparableDate);
    const isWorkDay = workDays.includes(workDayCode);
    const absence = isWorkDay ? getAbsenceForComparableDate(therapist, comparableDate) : null;
    const specialDay = isWorkDay && !absence ? getSpecialDayForComparableDate(therapist, comparableDate) : null;
    if (isWorkDay && !absence && !specialDay) plannedMinutes += dailyPlannedMinutes;
  });

  const appSaldoMinutes = totalMinutes - plannedMinutes;
  const stundenStartsaldoMinuten = getStundenStartsaldoMinutes(settings);
  const stundenAbgleichMinuten = (therapist.stundenAbgleiche || [])
    .filter((item) => isDateInRange(item?.datum, effectiveFromDate, toDate))
    .reduce((sum, item) => sum + Math.max(0, Number(item?.minuten || 0)), 0);
  const saldoMinutes = appSaldoMinutes + stundenStartsaldoMinuten - stundenAbgleichMinuten;

  const byPatient = new Map();
  allEntries
    .filter((entry) => isDateInRange(entry.date, fromDate, toDate))
    .forEach((entry) => {
      const key = entry.patientId || entry.patientName;
      if (!byPatient.has(key)) {
        byPatient.set(key, { patientName: entry.patientName, birthDate: entry.birthDate, homeName: entry.homeName, totalMinutes: 0 });
      }
      byPatient.get(key).totalMinutes += entry.minutes;
    });
  const patientRows = Array.from(byPatient.values()).sort((a, b) => a.patientName.localeCompare(b.patientName, "de"));

  return {
    totalMinutes,
    plannedMinutes,
    appSaldoMinutes,
    stundenStartsaldoMinuten,
    saldoMinutes,
    fastStartDatum: fastStartComparable ? formatDeDate(fastStartComparable) : "",
    patientRows
  };
}

function bindDeDateAutoFormat(input) {
  if (!input) return;
  input.addEventListener("input", () => {
    const digits = input.value.replace(/\D/g, "").slice(0, 8);
    let formatted = digits;
    if (digits.length > 4) formatted = `${digits.slice(0, 2)}.${digits.slice(2, 4)}.${digits.slice(4)}`;
    else if (digits.length > 2) formatted = `${digits.slice(0, 2)}.${digits.slice(2)}`;
    input.value = formatted;
  });
}

// ansicht (der nur die Fahrten EINES Patienten zeigt).
function renderKilometerTab(therapist) {
  const travelLog = [...(therapist.kilometer?.travelLog || [])]
    .sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")));
  const offen = travelLog.filter((k) => !k.abgerechnet);
  const abgegeben = travelLog.filter((k) => k.abgerechnet);
  const sumKm = (rows) => rows.reduce((sum, k) => sum + (Number(k.km) || 0), 0);

  return `
    <div class="card">
      <h3>Noch nicht abgegeben</h3>
      <p class="muted">${offen.length} Fahrt(en) · ${sumKm(offen).toFixed(1)} km gesamt</p>
      ${renderKilometerRows(offen)}
    </div>
    <div class="card">
      <h3>Bereits abgegeben</h3>
      <p class="muted">${abgegeben.length} Fahrt(en) · ${sumKm(abgegeben).toFixed(1)} km gesamt</p>
      ${renderKilometerRows(abgegeben)}
    </div>
  `;
}

// Reiter "Einrichtung / Patient", Ansicht "Nach Einrichtung": Einrichtungen
// und Patienten als eigenständige, unabhängig aufklappbare Accordions
// (statt Klick-Auswahl mit Detail-Panel unterhalb der gesamten Liste).
function renderPatientenHomeGrouped(therapist, homes, search) {
  const openHomes = getStateSet(uiState.openHomes, therapist.therapistId);
  const openPatients = getStateSet(uiState.openPatients, therapist.therapistId);

  const filteredHomes = (homes || []).map((home) => {
    const patients = [...(home.patients || [])]
      .filter((p) => {
        if (!search) return true;
        const haystack = `${p.firstName} ${p.lastName} ${p.birthDate} ${home.name}`.toLowerCase();
        return haystack.includes(search);
      })
      .sort((a, b) => `${a.lastName} ${a.firstName}`.localeCompare(`${b.lastName} ${b.firstName}`, "de"));
    return { home, patients };
  })
    .filter((row) => !search || row.patients.length > 0)
    .sort((a, b) => (a.home.name || "").localeCompare(b.home.name || "", "de"));

  if (filteredHomes.length === 0) return '<p class="muted">Keine Einrichtungen/Patienten gefunden.</p>';

  return filteredHomes.map(({ home, patients }) => {
    const isHomeOpen = search ? true : openHomes.has(home.homeId);
    return `
      <details class="accordion" data-home-id="${esc(home.homeId)}" ${isHomeOpen ? "open" : ""}>
        <summary>
          <span>${esc(home.name || "—")}</span>
          <span class="muted">${patients.length} Patient(en)</span>
        </summary>
        <div class="accordion-body">
          ${patients.length === 0 ? '<p class="muted">Keine Patienten.</p>' : patients.map((patient) => {
            const isPatientOpen = openPatients.has(patient.patientId);
            return `
              <details class="accordion ${patient.inactive ? "inactive" : ""}" data-patient-id="${esc(patient.patientId)}" ${isPatientOpen ? "open" : ""}>
                <summary>
                  <span>${renderPatientSummaryLine(patient)}${patient.inactive ? ' <span class="pill-red">Inaktiv</span>' : ""}</span>
                </summary>
                <div class="accordion-body">${renderPatientDetailBody(therapist, home, patient)}</div>
              </details>
            `;
          }).join("")}
        </div>
      </details>
    `;
  }).join("");
}

// Reiter "Befreiungen": Liste aller Patienten, die als zuzahlungsbefreit
// markiert sind, über alle Einrichtungen des Therapeuten hinweg.
function getBefreitePatientsForTherapist(therapist) {
  const rows = [];
  (therapist.homes || []).forEach((home) => {
    (home.patients || []).forEach((patient) => {
      if (patient.zuzahlungsstatus === "ja") rows.push({ home, patient });
    });
  });
  return rows.sort((a, b) => `${a.patient.lastName} ${a.patient.firstName}`.localeCompare(`${b.patient.lastName} ${b.patient.firstName}`, "de"));
}

function renderBefreiungenTab(therapist) {

  const toDate = uiState.stundenTo[tid] || todayDe;

  const effectiveTo = mode === "tag" ? singleDate : toDate;
  const summary = getTimePeriodSummaryForViewer(therapist, effectiveFrom, effectiveTo);

  return `
    <div class="card">
      <h3 style="margin-top:0;">Stundenübersicht</h3>
      <div class="row" style="margin-top:0;">

      ${mode === "tag" ? `

      <h4 style="margin-top:0;">Stundensaldo im gewählten Zeitraum</h4>

function renderTherapistBody(therapist) {
  const tid = therapist.therapistId;
  const tab = uiState.activeTab[tid] || "patienten";
  const search = (uiState.searchText[tid] || "").trim().toLowerCase();
  const hasSearch = tab === "patienten" || tab === "aerzte";

  let extraControlsHtml = "";
  let listHtml = "";

  if (tab === "patienten") {
    const groupMode = uiState.groupMode[tid] || "home";
    extraControlsHtml = `
      <div class="row" style="margin-top:0;">
        <button class="groupModeBtn ${groupMode === "home" ? "" : "secondary"}" data-mode="home" style="flex:1;">Nach Einrichtung</button>
        <button class="groupModeBtn ${groupMode === "alpha" ? "" : "secondary"}" data-mode="alpha" style="flex:1;">Alle alphabetisch</button>
      </div>
    `;
    if (groupMode === "alpha") {
      let rows = getAllPatientsForTherapist(therapist);
      if (search) {
        rows = rows.filter((row) => {
          const haystack = `${row.patient.firstName} ${row.patient.lastName} ${row.patient.birthDate} ${row.home.name}`.toLowerCase();
          return haystack.includes(search);
        });
      }
      listHtml = renderPatientenAlpha(therapist, rows);
    } else {
      listHtml = renderPatientenHomeGrouped(therapist, therapist.homes || [], search);
    }
  } else if (tab === "aerzte") {
    const doctors = getAllDoctorsForTherapist(therapist);
    listHtml = renderAerzteTab(therapist, doctors, search);
  } else if (tab === "befreiungen") {
    listHtml = renderBefreiungenTab(therapist);
  } else if (tab === "kilometer") {
    listHtml = renderKilometerTab(therapist);
  } else if (tab === "abgabelisten") {
    listHtml = renderAbgabelistenTab(therapist);
  } else if (tab === "stunden") {
    listHtml = renderStundenTab(therapist);
  }

  return `
    <div class="tab-row">
      <button class="tabBtn ${tab === "patienten" ? "active" : ""}" data-tab="patienten">Einrichtung / Patient</button>
      <button class="tabBtn ${tab === "aerzte" ? "active" : ""}" data-tab="aerzte">Ärzte</button>
      <button class="tabBtn ${tab === "befreiungen" ? "active" : ""}" data-tab="befreiungen">Befreiungen</button>
    </div>
    <div class="tab-row">
      <button class="tabBtn ${tab === "kilometer" ? "active" : ""}" data-tab="kilometer">Kilometer</button>
      <button class="tabBtn ${tab === "abgabelisten" ? "active" : ""}" data-tab="abgabelisten">Abgabelisten</button>
      <button class="tabBtn ${tab === "stunden" ? "active" : ""}" data-tab="stunden">Stunden</button>
    </div>
    ${extraControlsHtml}
    ${hasSearch ? `<input type="text" class="searchInput" placeholder="Suche..." value="${esc(uiState.searchText[tid] || "")}">` : ""}
    <div style="margin-top:12px;">${listHtml}</div>
  `;
}

function render() {
  const therapists = Object.values(store.therapists || {}).sort((a, b) => a.therapistName.localeCompare(b.therapistName, "de"));

  app.innerHTML = `
    <div class="card">
      <h2>Export-Datei laden</h2>
      <label for="fileInput">Export-ZIP (.zip)</label>
      <input id="fileInput" type="file" accept=".zip">
      <label for="pinInput">PIN</label>
      <input id="pinInput" type="password" inputmode="numeric" autocomplete="off">
      <div class="row">
        <button id="loadBtn">Datei laden</button>
      </div>
      <div id="loadMsg"></div>
    </div>

    ${therapists.length === 0 ? `
      <div class="card"><p class="muted">Noch keine Daten geladen. Bitte eine Export-Datei auswählen.</p></div>
    ` : therapists.map((therapist) => `
      <details class="accordion" ${uiState.expandedTherapist === therapist.therapistId ? "open" : ""} data-therapist-toggle="${esc(therapist.therapistId)}">
        <summary>
          <span>${esc(therapist.therapistName)}</span>
          <span class="muted">${(therapist.homes || []).reduce((sum, h) => sum + (h.patients || []).length, 0)} Patient(en) · zuletzt geladen: ${esc(formatDeDate(therapist.lastImportAt?.slice(0, 10)) || "—")}</span>
        </summary>
        <div class="accordion-body" id="therapist-body-${esc(therapist.therapistId)}">
          ${uiState.expandedTherapist === therapist.therapistId ? renderTherapistBody(therapist) : ""}
        </div>
      </details>
    `).join("")}
  `;

  bindEvents(therapists);
}

function bindEvents(therapists) {
  document.getElementById("loadBtn").onclick = async () => {
    const fileInput = document.getElementById("fileInput");
    const pinInput = document.getElementById("pinInput");
    const msg = document.getElementById("loadMsg");
    msg.className = "error";
    msg.textContent = "";

    const file = fileInput.files?.[0];
    const pin = pinInput.value;

    if (!file) {
      msg.textContent = "Bitte eine Datei auswählen.";
      return;
    }
    if (!pin) {
      msg.textContent = "Bitte die PIN eingeben.";
      return;
    }

    try {
      const { appData } = await readExportFile(file, pin);
      store = mergeAppDataIntoStore(store, appData);
      saveStore(store);
      uiState.expandedTherapist = appData.settings?.therapistId || null;
      msg.className = "muted";
      msg.textContent = "Datei erfolgreich geladen und abgeglichen.";
      render();
    } catch (err) {
      console.error(err);
      msg.textContent = err?.message || "Datei konnte nicht geladen werden.";
    }
  };

  document.querySelectorAll("[data-therapist-toggle]").forEach((el) => {
    el.addEventListener("toggle", () => {
      if (el.open) {
        uiState.expandedTherapist = el.dataset.therapistToggle;
        const body = document.getElementById(`therapist-body-${el.dataset.therapistToggle}`);
        const therapist = therapists.find((t) => t.therapistId === el.dataset.therapistToggle);
        if (body && therapist) {
          body.innerHTML = renderTherapistBody(therapist);
          bindBodyEvents(therapist);
        }
      } else if (uiState.expandedTherapist === el.dataset.therapistToggle) {
        uiState.expandedTherapist = null;
      }
    });
  });

  if (uiState.expandedTherapist) {
    const therapist = therapists.find((t) => t.therapistId === uiState.expandedTherapist);
    if (therapist) bindBodyEvents(therapist);
  }
}

function bindBodyEvents(therapist) {
  const body = document.getElementById(`therapist-body-${therapist.therapistId}`);
  if (!body) return;

  body.querySelectorAll(".tabBtn").forEach((btn) => {
    btn.onclick = () => {
      uiState.activeTab[therapist.therapistId] = btn.dataset.tab;
      body.innerHTML = renderTherapistBody(therapist);
      bindBodyEvents(therapist);
    };
  });

  const searchInput = body.querySelector(".searchInput");
  if (searchInput) {
    searchInput.oninput = () => {
      uiState.searchText[therapist.therapistId] = searchInput.value;
      const focusPos = searchInput.selectionStart;
      body.innerHTML = renderTherapistBody(therapist);
      bindBodyEvents(therapist);
      const newInput = body.querySelector(".searchInput");
      if (newInput) {
        newInput.focus();
        newInput.setSelectionRange(focusPos, focusPos);
      }
    };
  }

  body.querySelectorAll(".groupModeBtn").forEach((btn) => {
    btn.onclick = () => {
      uiState.groupMode[therapist.therapistId] = btn.dataset.mode;
      body.innerHTML = renderTherapistBody(therapist);
      bindBodyEvents(therapist);
    };
  });

  // Einrichtungen/Patienten/Ärzte klappen jetzt per natives <details> auf -
  // die Toggle-Listener merken sich nur, welche Accordions offen sind,
  // damit dieser Zustand einen späteren vollständigen Re-Render (Suche,
  // Reiterwechsel) übersteht. Der Inhalt selbst ist bereits beim Rendern
  // vollständig vorhanden (kein Nachladen nötig).
  body.querySelectorAll("details[data-home-id]").forEach((el) => {
    el.addEventListener("toggle", () => {
      const set = getStateSet(uiState.openHomes, therapist.therapistId);
      if (el.open) set.add(el.dataset.homeId); else set.delete(el.dataset.homeId);
    });
  });
  body.querySelectorAll("details[data-patient-id]").forEach((el) => {
    el.addEventListener("toggle", () => {
      const set = getStateSet(uiState.openPatients, therapist.therapistId);
      if (el.open) set.add(el.dataset.patientId); else set.delete(el.dataset.patientId);
    });
  });
  body.querySelectorAll("details[data-arzt-name]").forEach((el) => {
    el.addEventListener("toggle", () => {
      const set = getStateSet(uiState.openArzt, therapist.therapistId);
      if (el.open) set.add(el.dataset.arztName); else set.delete(el.dataset.arztName);
    });
  });

  body.querySelectorAll(".stundenModeBtn").forEach((btn) => {
    btn.onclick = () => {
      uiState.stundenMode[therapist.therapistId] = btn.dataset.mode;
      body.innerHTML = renderTherapistBody(therapist);
      bindBodyEvents(therapist);
    };
  });

  const stundenDateInput = body.querySelector(".stundenDateInput");
  if (stundenDateInput) {
    bindDeDateAutoFormat(stundenDateInput);
    stundenDateInput.addEventListener("change", () => {
      uiState.stundenDate[therapist.therapistId] = stundenDateInput.value.trim();
      body.innerHTML = renderTherapistBody(therapist);
      bindBodyEvents(therapist);
    });
  }
  const stundenFromInput = body.querySelector(".stundenFromInput");
  if (stundenFromInput) {
    bindDeDateAutoFormat(stundenFromInput);
    stundenFromInput.addEventListener("change", () => {
      uiState.stundenFrom[therapist.therapistId] = stundenFromInput.value.trim();
      body.innerHTML = renderTherapistBody(therapist);
      bindBodyEvents(therapist);
    });
  }
  const stundenToInput = body.querySelector(".stundenToInput");
  if (stundenToInput) {
    bindDeDateAutoFormat(stundenToInput);
    stundenToInput.addEventListener("change", () => {
      uiState.stundenTo[therapist.therapistId] = stundenToInput.value.trim();
      body.innerHTML = renderTherapistBody(therapist);
      bindBodyEvents(therapist);
    });
  }
}

renderGate();

// Ermöglicht "Zum Desktop hinzufügen" auf Laptop/PC (Chrome/Edge zeigen dafür
// ein Installieren-Symbol in der Adressleiste, sobald Manifest + Icons + ein
// registrierter Service Worker vorhanden sind). Bewusst ein reiner
// Durchreich-Worker OHNE jegliches Caching (kein caches.open/cache.put) -
// die Haupt-App hatte ihren Service Worker wegen Problemen mit veralteten
// zwischengespeicherten Ständen bei häufigen Updates wieder entfernt; dieser
// hier lädt jede Anfrage immer frisch vom Netz und kann daher keine
// vergleichbaren Update-Probleme verursachen, dient nur der Installierbarkeit.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js", { scope: "./" }).catch(() => {});
}

// "Aktualisieren"-Button: deregistriert einen eventuell veralteten Service
// Worker, leert die Cache-Storage (unser eigener Worker legt zwar nichts
// dort ab, ein älterer Browser-Stand könnte aber noch etwas hinterlassen
// haben) und lädt die Seite mit einem Cache-Busting-Parameter neu, damit
// garantiert die neueste, vom Server ausgelieferte Version geladen wird -
// ein normales Neuladen kann sonst eine im HTTP-Cache liegende ältere
// index.html erneut anzeigen, ohne dass eine neue Version durchkommt.
document.getElementById("hardRefreshBtn").onclick = async () => {
  try {
    if ("serviceWorker" in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map((reg) => reg.unregister()));
    }
    if ("caches" in window) {
      const cacheKeys = await caches.keys();
      await Promise.all(cacheKeys.map((key) => caches.delete(key)));
    }
  } catch (err) {
    console.error("Aktualisieren: Cache/Service Worker konnten nicht vollständig geleert werden:", err);
  }
  const url = new URL(window.location.href);
  url.searchParams.set("_refresh", Date.now().toString());
  window.location.replace(url.toString());
};
</script>
